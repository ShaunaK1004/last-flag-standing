  ctx.fillStyle=PAL.gold;ctx.font='900 60px system-ui,sans-serif';ctx.fillText('FINAL TOURNAMENT LEADERBOARD',W/2,115);
  ctx.fillStyle=PAL.dim;ctx.font='700 26px system-ui,sans-serif';ctx.fillText('QUALIFICATION → R32 → R16 → QF → SF → THIRD PLACE → FINAL',W/2,160);
  const podium=[['WORLD CONQUERED',window.__FWA_CHAMPION],['SECOND PLACE',window.__FWA_SECOND],['THIRD PLACE',window.__FWA_THIRD]];
  podium.forEach((r,i)=>{const y=270+i*155;ctx.fillStyle=i===0?PAL.gold:PAL.ink;ctx.font='900 32px system-ui,sans-serif';ctx.fillText(r[0],W/2,y);const c=r[1]&&countryByCode(r[1].code);if(c)ctx.drawImage(sprites.get(c.code),W/2-42,y+22,84,84);ctx.fillStyle=PAL.ink;ctx.font='800 30px system-ui,sans-serif';ctx.fillText(r[1]?.name||'—',W/2,y+137);});
  const rank=(window.__FWA_QUAL_RESULTS||[]).slice().sort((a,b)=>b.survival-a.survival);const progress=window.__FWA_PROGRESS||{};const top=rank.filter(x=>progress[x.code]).slice(0,8);
  ctx.textAlign='left';ctx.fillStyle=PAL.gold;ctx.font='900 28px system-ui,sans-serif';ctx.fillText('TOP QUALIFICATION / KNOCKOUT PROGRESSION',55,780);
  ctx.font='700 23px system-ui,sans-serif';top.forEach((r,i)=>{const q=progress[r.code];const stages=(q.stages||[]).map(s=>s.toUpperCase()).join(' → ');ctx.fillStyle=PAL.ink;ctx.fillText(String(i+1).padStart(2,'0')+'  '+r.name,60,825+i*55);ctx.fillStyle=PAL.dim;ctx.fillText(stages,360,825+i*55);});
  ctx.textAlign='center';ctx.fillStyle=PAL.dim;ctx.font='700 28px system-ui,sans-serif';ctx.fillText('NEXT BATTLE STARTS IN '+Math.max(0,Math.ceil(G.leaderboardTimer))+'s',W/2,1505);ctx.restore();
}
function drawEquipmentFX(){
  ctx.save();
  for(const b of blasts){const a=Math.max(0,1-b.t/.55);ctx.strokeStyle='rgba(255,90,60,'+a+')';ctx.lineWidth=10*a+2;ctx.shadowColor='#ff6a2d';ctx.shadowBlur=22;ctx.beginPath();ctx.arc(CFG.CX+b.x,CFG.CY+b.y,b.r,0,Math.PI*2);ctx.stroke();}
  for(const q of sparks){ctx.globalAlpha=Math.max(0,Math.min(1,q.t));ctx.fillStyle=q.c;ctx.fillRect(CFG.CX+q.x-1.6,CFG.CY+q.y-1.6,3.4,3.4);ctx.globalAlpha=1;}
  for(const m of outMarks){const x=CFG.CX+Math.cos(m.a)*CFG.ARENA_R,y=CFG.CY+Math.sin(m.a)*CFG.ARENA_R;ctx.globalAlpha=Math.max(0,Math.min(1,m.t/1.5));ctx.font='900 22px Trebuchet MS,sans-serif';ctx.textAlign='center';ctx.fillStyle='#e6e9ee';ctx.shadowColor='#000';ctx.shadowBlur=5;ctx.fillText('OUT',x,y+7);ctx.globalAlpha=1;}
  for(const f of floaters){ctx.globalAlpha=Math.max(0,Math.min(1,f.t));ctx.font='800 14px Trebuchet MS,sans-serif';ctx.textAlign='center';ctx.fillStyle=f.c||'#fff';ctx.shadowColor='#000';ctx.shadowBlur=5;ctx.fillText(f.text,CFG.CX+f.x,CFG.CY+f.y);ctx.globalAlpha=1;}
  ctx.restore();
}
function render(){elapsed=(G.t||0)/1000;drawBackdrop();if(G.phase==='PODIUM'){drawPodium();return;}if(G.phase==='LEADERBOARD'){drawLeaderboard();return;}ctx.save();if(G.shake>0.2)ctx.translate(rnd(-G.shake,G.shake),rnd(-G.shake,G.shake));drawArena();drawSpokes();drawHub();drawEnhancedBalls();drawEquipmentFX();ctx.restore();drawEnhancedHUD();drawBanner();drawEnhancedLower();drawKillCard();if(G.phase==='WINNER'){drawWinner();}}

/* Replace chat source with a small browser bridge. Live mode uses the same API
   endpoint shipped by the circular-ring build; simulation mode keeps the arena
   testable without a live broadcast. */
let chatTimer=null, simHandles=['Aarav','Bea','Rafi','Nadia','Kwame','Priya','Yusuf','Maya','Leo','Sana','Arjun','Lina','Omar','Zoya','Noah','Ivy'];
async function pollLive(){try{const r=await fetch('/api/youtube-chat?action=sync',{cache:'no-store'});const j=await r.json();for(const it of (j.items||[]))handleChat(it.username||'viewer',it.text||'');}catch(e){}chatTimer=setTimeout(pollLive,5000);}
function startChat(){
  /* No synthetic viewers/flags are spawned. Custom balls enter ONLY through the
     actual chat bridge. This keeps the 32-base roster visually distinct from
     the 32 chat-driven capacity. */
  if(chatMode==='live'){clearTimeout(chatTimer);pollLive();}
}

/* Intake preservation: entries that arrive while the old frame is being replaced
   are kept in the waiting list rather than duplicated. */
window.FWAChat={ingest:handleChat,waiting:waitingList,getState:()=>({waiting:waitingList.length,custom:G?.balls.filter(b=>b.alive&&b.custom).length,shields:shieldUses,revivals:revivalUses})};

/* Route a message through the enhancement layer. */
if(window.ChatSource){window.ChatSource.onMessage=function(u,t){handleChat(u,t);};}
window.addEventListener('pointerdown',()=>{ac();COMMENTARY.start();});window.addEventListener('keydown',()=>{ac();COMMENTARY.start();});

/* The original Natural build already has one requestAnimationFrame loop. Its first
   callback resolves the overridden tick/render bindings below, then continues with the
   new frame binding, so no second RAF loop is started here. */
function frame(now){let dt=now-last;last=now;if(dt>250)dt=250;if(G.phase==='PODIUM')updatePodium(dt/1000);else if(G.phase==='LEADERBOARD'){G.leaderboardTimer-=dt/1000;if(G.leaderboardTimer<=0){window.__FWA_QUAL_RESULTS=[];window.__FWA_PROGRESS=Object.create(null);window.__FWA_STAGE='qualifying';window.__FWA_KO_POOL=[];window.__FWA_SF_SURVIVORS=[];window.__FWA_SEMIFINAL_LOSERS=[];window.__FWA_THIRD=null;window.__FWA_SECOND=null;window.__FWA_CHAMPION=null;autoEquipIndex=0;autoEquipNext=10;startEnhancedRound();}}else tick(dt);render();requestAnimationFrame(frame);}

/* First-run roster: preserve old waiting list, then start the requested 20+12 base. */
window.__FWA_QUAL_RESULTS=[];window.__FWA_PROGRESS=Object.create(null);window.__FWA_KO_POOL=[];window.__FWA_STAGE='qualifying';window.__FWA_SF_SURVIVORS=[];window.__FWA_SEMIFINAL_LOSERS=[];window.__FWA_STAGE_WINNERS=[];window.__FWA_START_WAITERS=[];autoEquipIndex=0;autoEquipNext=10;startEnhancedRound();startChat();</script>
