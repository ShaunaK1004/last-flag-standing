<!DOCTYPE html>

<!--
  FLAGS WAR ARENA  -  single-file build for OBS / YouTube Live
  ================================================================
  Design space is 1080x1920. Every geometric constant below was measured from the
  reference clip (video_2026-08-25_12-27-41.mp4) and converted with
  capture px x 1.875 = design px. Provenance is noted per constant; see
  COUNTRYBALL_ROYALE_plan.md for the derivations.

  Assets: flags are drawn procedurally; sound effects are synthesised with WebAudio and live commentary uses browser speech synthesis, so
  neither can fail. The ONE binary is bg.jpg, which must be deployed next to this
  file - same origin, same commit, no CDN. If it is missing or fails to decode the
  build falls back to the original procedural starfield and keeps running; a 24/7
  unattended stream must not be able to go black over an image.
  Drop in audio/loop.mp3 later if you want a music bed.

  Deliberate deviations from the reference, all reported rather than silent:
   - true circles (the reference recording is vertically stretched 3.7%; that is a
     capture defect, not a design choice)
   - |v| is pinned to a constant. The reference's speed distribution could not be
     measured, and elastic exchange plus rounding lets balls stall, which looks
     broken on a 24/7 stream.
   - no gear icon / no operator controls. Nothing to leave in the wrong position.
-->

<head>
<meta charset="utf-8"/>
<title>Flags War Arena - v20</title>

  html,body{margin:0;padding:0;background:#000;overflow:hidden;height:100%}
  #wrap{position:fixed;inset:0;display:grid;place-items:center}
  canvas{display:block;image-rendering:auto}
</style>
</head>

  BALL_R:         37.5,   // measured 20 x 1.875; ball/arena = 0.0776

                          //   fell to 1.5-2.3 s against a measured 4.32 s across the whole
                          //   (speed, suction) grid. Prediction failed, so the model is out.
                          //   n=0, uniform, fits both measured durations to within 7%.

                          // as a multiple of SUCTION. DERIVED, not tuned: pinned |v| with a
                          // constant inward pull has a stable circular orbit at r=v^2/a=278 px,
                          // so a lone tangential ball never reaches the 66 px mouth. Breaking
                          // that orbit needs the pull to reach v^2/HOLE_R = 802 px/s^2 = 4.22x
                          // SUCTION. Spending the surplus over ~5 s from the 1 s dead zone
                          // gives (4.22-1)/5 = 0.64; 0.65 rounds it up so the orbit is provably
                          // gone by 5.95 s, just past the reference's longest opening (5.71 s).

  // So they are set rare. These five numbers are the intended tuning surface.

/* ---- flag painter -------------------------------------------------------- */
function paintFlag(ctx, ops, w, h){
  const px = (f)=>f*w, py=(f)=>f*h;
  ctx.fillStyle = '#dddddd'; ctx.fillRect(0,0,w,h);
  for (const op of ops){
    const k = op[0];
    if (k==='fill'){ ctx.fillStyle=op[1]; ctx.fillRect(0,0,w,h); }
    else if (k==='h'){ const n=op.length-1; for(let i=0;i<n;i++){ ctx.fillStyle=op[i+1]; ctx.fillRect(0,Math.floor(h*i/n),w,Math.ceil(h/n)+1);} }
    else if (k==='v'){ const n=op.length-1; for(let i=0;i<n;i++){ ctx.fillStyle=op[i+1]; ctx.fillRect(Math.floor(w*i/n),0,Math.ceil(w/n)+1,h);} }
    else if (k==='hw'){ const tot=op[1].reduce((a,b)=>a+b[0],0); let y=0; for(const [wt,c] of op[1]){ const hh=h*wt/tot; ctx.fillStyle=c; ctx.fillRect(0,Math.floor(y),w,Math.ceil(hh)+1); y+=hh; } }
    else if (k==='vw'){ const tot=op[1].reduce((a,b)=>a+b[0],0); let x=0; for(const [wt,c] of op[1]){ const ww=w*wt/tot; ctx.fillStyle=c; ctx.fillRect(Math.floor(x),0,Math.ceil(ww)+1,h); x+=ww; } }
    else if (k==='stripes5'||k==='stripes9'||k==='stripes13'){
      const n = k==='stripes5'?5 : k==='stripes9'?9 : 13;
      for(let i=0;i<n;i++){ ctx.fillStyle = (i%2===0)?op[1]:op[2]; ctx.fillRect(0,Math.floor(h*i/n),w,Math.ceil(h/n)+1); }
    }
    else if (k==='rect'){ ctx.fillStyle=op[1]; ctx.fillRect(px(op[2]),py(op[3]),px(op[4]),py(op[5])); }
    else if (k==='disc'){ ctx.fillStyle=op[1]; ctx.beginPath(); ctx.arc(px(op[2]),py(op[3]),px(op[4]),0,7); ctx.fill(); }
    else if (k==='ring'){ ctx.strokeStyle=op[1]; ctx.lineWidth=px(op[5]); ctx.beginPath(); ctx.arc(px(op[2]),py(op[3]),px(op[4]),0,7); ctx.stroke(); }
    else if (k==='band'){ ctx.strokeStyle='#ffffff'; ctx.lineWidth=py(0.035); ctx.beginPath(); ctx.arc(px(op[2]),py(op[3])+py(0.10),px(op[4])*1.15,Math.PI*1.15,Math.PI*1.85); ctx.stroke(); }
    else if (k==='cross'){
      const t=op[2], sc=op[3]===1?1:(op[3]||1);
      const cw=w*sc, ch=h*sc, ox=(w-cw)/2, oy=(h-ch)/2;
      ctx.fillStyle=op[1];
      if(op.length>4){ const rx=px(op[4]),ry=py(op[5]); ctx.fillRect(ox,oy+ch/2-py(t)/2,cw,py(t)); ctx.fillRect(ox+cw/2-px(t)/2,oy,px(t),ch); }
      else { ctx.fillRect(ox,oy+ch/2-py(t)/2,cw,py(t)); ctx.fillRect(ox+cw/2-px(t)/2,oy,px(t),ch); }
    }
    else if (k==='nordic'){ const t=op[2]; ctx.fillStyle=op[1]; ctx.fillRect(0,h*0.5-py(t)/2,w,py(t)); ctx.fillRect(w*0.36-px(t)/2,0,px(t),h); }
    else if (k==='diag'){ const t=op[2]; ctx.save(); ctx.strokeStyle=op[1]; ctx.lineWidth=px(t); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(w,h); ctx.moveTo(w,0); ctx.lineTo(0,h); ctx.stroke(); ctx.restore(); }
    else if (k==='diag2'){ ctx.save(); ctx.strokeStyle=op[1]; ctx.lineWidth=px(0.05); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(px(op[2]),py(op[3])); ctx.moveTo(px(op[2]),0); ctx.lineTo(0,py(op[3])); ctx.stroke(); ctx.restore(); }
    else if (k==='tri'){ ctx.fillStyle=op[1]; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(px(op[2]),h/2); ctx.lineTo(0,h); ctx.closePath(); ctx.fill(); }
    else if (k==='diamond'){ ctx.fillStyle=op[1]; ctx.beginPath(); ctx.moveTo(w/2,h*(0.5-op[2])); ctx.lineTo(w*(0.5+op[2]*0.92),h/2); ctx.lineTo(w/2,h*(0.5+op[2])); ctx.lineTo(w*(0.5-op[2]*0.92),h/2); ctx.closePath(); ctx.fill(); }
    else if (k==='star'){ star(ctx,px(op[2]),py(op[3]),px(op[4]),op[5],op[6],op[1]); }
    else if (k==='sun'){ ctx.fillStyle=op[1]; ctx.beginPath(); ctx.arc(px(op[2]),py(op[3]),px(op[4]),0,7); ctx.fill();
      ctx.strokeStyle=op[1]; ctx.lineWidth=px(0.014);
      for(let i=0;i<16;i++){ const a=i*Math.PI/8; ctx.beginPath(); ctx.moveTo(px(op[2])+Math.cos(a)*px(op[4])*1.15, py(op[3])+Math.sin(a)*px(op[4])*1.15); ctx.lineTo(px(op[2])+Math.cos(a)*px(op[4])*1.7, py(op[3])+Math.sin(a)*px(op[4])*1.7); ctx.stroke(); } }
    else if (k==='cres'){
      // A real lune, traced as two arcs. The first build filled a disc and then bit a
      // second disc out of it with globalCompositeOperation='destination-out' - which
      // erases the DESTINATION, i.e. it cut through the flag underneath as well and
      // left a transparent hole. Clipped into a ball sprite that hole showed the arena
      // floor through Turkey, Pakistan, Malaysia and Singapore. A path needs no
      // compositing, so nothing beneath the crescent is destroyed.
      const cx=px(op[2]), cy=py(op[3]), r=px(op[4]);
      const d=r*0.36, ri=r*0.84;                      // identical offset and inner radius
      const xi=(d*d+r*r-ri*ri)/(2*d);                 // circle-circle intersection
      const yi=Math.sqrt(Math.max(0,r*r-xi*xi));
      const th=Math.atan2(yi,xi), ph=Math.atan2(yi,xi-d);
      ctx.fillStyle=op[1]; ctx.beginPath();
      ctx.arc(cx,   cy, r,  th, 2*Math.PI-th, false); // outer major arc, around the left
      ctx.arc(cx+d, cy, ri, -ph, ph,          true);  // inner arc back through the left
      ctx.closePath(); ctx.fill(); }
    else if (k==='spokes'){ ctx.strokeStyle=op[1]; ctx.lineWidth=px(0.008);
      for(let i=0;i<op[5];i++){ const a=i*2*Math.PI/op[5]; ctx.beginPath(); ctx.moveTo(px(op[2]),py(op[3])); ctx.lineTo(px(op[2])+Math.cos(a)*px(op[4]), py(op[3])+Math.sin(a)*px(op[4])); ctx.stroke(); } }
    else if (k==='dots'){ const [_,c,x,y,ww,hh,cols,rows]=op; ctx.fillStyle=c;
      for(let i=0;i<cols;i++) for(let j=0;j<rows;j++){
        const fx=x+(ww)*((i+0.5)/cols), fy=y+(hh)*((j+0.5)/rows);
        star(ctx,px(fx),py(fy),px(Math.min(ww/cols,hh/rows)*0.42),5,-90,c);} }
    else if (k==='leaf'){ ctx.fillStyle=op[1]; ctx.save(); ctx.translate(w/2,h/2); const s=w*0.16;
      ctx.beginPath();
      const pts=[[0,-1.15],[0.22,-0.5],[0.62,-0.62],[0.42,-0.16],[0.95,0.06],[0.5,0.36],[0.62,0.72],[0.15,0.52],[0.06,1.15],[-0.06,1.15],[-0.15,0.52],[-0.62,0.72],[-0.5,0.36],[-0.95,0.06],[-0.42,-0.16],[-0.62,-0.62],[-0.22,-0.5]];
      pts.forEach((p,i)=> i?ctx.lineTo(p[0]*s,p[1]*s):ctx.moveTo(p[0]*s,p[1]*s));
      ctx.closePath(); ctx.fill(); ctx.restore(); }
    else if (k==='taeguk'){ const cx=px(op[1]),cy=py(op[2]),r=px(op[3]);
      ctx.fillStyle='#cd2e3a'; ctx.beginPath(); ctx.arc(cx,cy,r,Math.PI,0); ctx.fill();
      ctx.fillStyle='#0047a0'; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI); ctx.fill();
      ctx.fillStyle='#cd2e3a'; ctx.beginPath(); ctx.arc(cx-r/2,cy,r/2,0,7); ctx.fill();
      ctx.fillStyle='#0047a0'; ctx.beginPath(); ctx.arc(cx+r/2,cy,r/2,0,7); ctx.fill(); }
    else if (k==='bars'){ ctx.fillStyle=op[1]; const bw=px(0.15),bh=py(0.028);
      [[0.16,0.18],[0.84,0.18],[0.16,0.82],[0.84,0.82]].forEach(([fx,fy])=>{
        for(let i=0;i<3;i++) ctx.fillRect(px(fx)-bw/2, py(fy)-bh*2+i*bh*1.7, bw, bh); }); }
    else if (k==='shield'){ ctx.fillStyle=op[1]; ctx.beginPath(); ctx.ellipse(px(op[2]),py(op[3]),px(0.09),py(0.26),0,0,7); ctx.fill();
      ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.ellipse(px(op[2]),py(op[3]),px(0.04),py(0.18),0,0,7); ctx.fill(); }
    else if (k==='ychev'){ ctx.fillStyle=op[1]; ctx.save(); ctx.beginPath();
      ctx.moveTo(0,0); ctx.lineTo(px(0.10),0); ctx.lineTo(px(0.56),h/2); ctx.lineTo(px(0.10),h); ctx.lineTo(0,h); ctx.lineTo(px(0.46),h/2); ctx.closePath(); ctx.fill(); ctx.restore(); }
  }
}
function star(ctx,cx,cy,r,n,rotDeg,color){
  ctx.fillStyle=color; ctx.beginPath();
  const rot=(rotDeg||0)*Math.PI/180, ir = n===6? r*0.577 : r*0.382;
  for(let i=0;i<n*2;i++){ const a=rot+i*Math.PI/n, rr=(i%2===0)?r:ir;
    const x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
  ctx.closePath(); ctx.fill();
}

/* ---- ball sprites: flag clipped to a circle, plus a gloss highlight ------ */
const SPR = 96;                       // sprite px; ball is 75 design px so this is ~1.3x
const sprites = new Map();
function buildSprites(){
  for (const c of COUNTRIES){
    const cv = document.createElement('canvas'); cv.width=cv.height=SPR;
    const g = cv.getContext('2d');
    // draw the 3:2 flag into a square, slightly zoomed so the motif dominates
    const fw = SPR*1.34, fh = SPR;
    const off = document.createElement('canvas'); off.width=fw; off.height=fh;
    paintFlag(off.getContext('2d'), c.ops, fw, fh);
    g.save(); g.beginPath(); g.arc(SPR/2,SPR/2,SPR/2-1,0,7); g.clip();
    g.drawImage(off, (SPR-fw)/2, 0);
    // spherical shading
    const sh = g.createRadialGradient(SPR*0.34,SPR*0.30,SPR*0.05, SPR*0.5,SPR*0.5,SPR*0.62);
    sh.addColorStop(0,'rgba(255,255,255,0.45)'); sh.addColorStop(0.42,'rgba(255,255,255,0.06)');
    sh.addColorStop(0.75,'rgba(0,0,0,0.10)'); sh.addColorStop(1,'rgba(0,0,0,0.46)');
    g.fillStyle=sh; g.fillRect(0,0,SPR,SPR);
    g.restore();
    g.strokeStyle='rgba(255,255,255,0.55)'; g.lineWidth=2;
    g.beginPath(); g.arc(SPR/2,SPR/2,SPR/2-1.5,0,7); g.stroke();
    sprites.set(c.code, cv);
  }
}

/* ==========================================================================
   3. AUDIO  -  synthesised, no files
   ========================================================================== */
let AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state==='suspended') AC.resume(); return AC; }
function blip(freq, dur, type, gain, slideTo){
  const a=ac(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,a.currentTime);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime+dur);
  g.gain.setValueAtTime(0,a.currentTime);
  g.gain.linearRampToValueAtTime(gain||0.25, a.currentTime+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime+dur);
  o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime+dur+0.02);
}
function noise(dur, gain, hp){
  const a=ac(); if(!a) return;
  const n=Math.floor(a.sampleRate*dur), b=a.createBuffer(1,n,a.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.2);
  const s=a.createBufferSource(); s.buffer=b;
  const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp||1200;
  const g=a.createGain(); g.gain.value=gain||0.22;
  s.connect(f).connect(g).connect(a.destination); s.start();
}
const SFX = {
  kill(){ blip(180,0.28,'sine',0.30,52); noise(0.34,0.26,1500); },
  double(){ SFX.kill(); setTimeout(()=>SFX.kill(),150); },
  shield(){ blip(880,0.30,'triangle',0.20,1320); },
  tumble(){ blip(90,0.55,'sawtooth',0.18,320); noise(0.5,0.14,400); },
  rapid(){ [0,90,180].forEach((d,i)=>setTimeout(()=>blip(600+i*180,0.10,'square',0.16),d)); },
  comeback(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>blip(f,0.20,'triangle',0.18),i*80)); },
  win(){ [523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>blip(f,0.42,'triangle',0.22),i*130)); },
  open(){ blip(300,0.14,'square',0.10,220); },
};

/* ==========================================================================
   3A. LIVE COMMENTARY - short, energetic stream-style TTS
   --------------------------------------------------------------------------
   Commentary follows the simulation rather than a prerecorded script. It calls
   eliminations, shields, comebacks and special events, then drops occasional
   audience prompts and exact survival milestones. This keeps the narration
   synchronized even though every draw is randomized.
   ========================================================================== */
const COMMENTARY = {
  enabled: true,
  speaking: false,
  speakingEquipment: false,
  queue: [],
  lastAudience: -999999,
  lastMilestone: 64,
  voice: null,
  // Slightly slower and warmer than the original robotic cadence.
  rate: 1.01,
  pitch: 1.08,
  volume: 0.92,
  pickVoice(){
    if (!('speechSynthesis' in window)) return;
    const vs = speechSynthesis.getVoices();
    if (!vs.length) return;

    // Prefer clearly female English voices first. Browser voice names differ by OS,
    // so use several common Windows/Chrome/macOS names before falling back to a
    // general English voice.
    const female = [
      /Microsoft.*(Zira|Jenny|Aria|Sonia|Ava|Emma|Sara|Michelle|Ana)/i,
      /Google US English/i,
      /(Samantha|Karen|Victoria|Moira|Tessa|Susan|Hazel|Libby|Linda|Heera)/i,
      /(Female|Woman)/i
    ];
    const english = vs.filter(v=>/^en[-_]/i.test(v.lang));
    for (const rx of female){
      const hit=english.find(v=>rx.test(v.name));
      if (hit){ this.voice=hit; return; }
    }
    this.voice = english.find(v=>/US|GB|AU|CA|IN/i.test(v.lang)) || english[0] || vs[0];
  },
  start(){
    if (!('speechSynthesis' in window)) return;
    this.enabled=true;
    this.pickVoice();
    if (speechSynthesis.paused) speechSynthesis.resume();
    this.flush();
  },
  say(text, priority=false, onend=null){
    if (!this.enabled || !('speechSynthesis' in window) || !text) return;
    if (typeof G!=='undefined' && G && G.phase==='WINNER') return;
    /* Normal/tournament commentary always wins. If an equipment line is currently
       being spoken, cancel it immediately rather than allowing it to finish and
       delaying the live commentary. Any stale equipment entries from an older
       state are also discarded and are never allowed to resume later. */
    if (this.speakingEquipment){
      try{ speechSynthesis.cancel(); }catch(e){}
      this.speaking=false; this.speakingEquipment=false;
    }
    this.queue=this.queue.filter(item=>!item.equipment);
    if (priority) this.queue.unshift({text:String(text),equipment:false,onend:onend});
    else this.queue.push({text:String(text),equipment:false,onend:onend});
    if (this.queue.length>10) this.queue.splice(0,this.queue.length-10);
    this.flush();
  },
  sayEquipment(text){
    if (!this.enabled || !('speechSynthesis' in window) || !text) return;
    /* Equipment commentary is strictly live and disposable: it is NEVER queued.
       If normal commentary is active or waiting, skip this line completely. If
       nothing normal is active, speak it immediately. If normal commentary starts
       while this line is speaking, say() above cancels it so it can never resume. */
    if (this.speaking || this.queue.some(item=>!item.equipment)) return;
    try{ speechSynthesis.cancel(); }catch(e){}
    this.speaking=false; this.speakingEquipment=false;
    const u=new SpeechSynthesisUtterance(String(text));
    u.voice=this.voice || undefined;
    u.rate=this.rate; u.pitch=this.pitch; u.volume=this.volume;
    this.speaking=true; this.speakingEquipment=true;
    u.onend=()=>{ this.speaking=false; this.speakingEquipment=false; };
    u.onerror=()=>{ this.speaking=false; this.speakingEquipment=false; };
    speechSynthesis.speak(u);
  },
  flush(){
    if (this.speaking || !this.queue.length || !this.enabled || !('speechSynthesis' in window)) return;
    const item=this.queue.shift();
    const text=item.text;
    const itemDone=item.onend;
    const u=new SpeechSynthesisUtterance(text);
    u.voice=this.voice || undefined;
    u.rate=this.rate;
    u.pitch=this.pitch;
    u.volume=this.volume;
    // Keep the delivery clean: short breaths/pauses are created naturally by
    // punctuation instead of chopping every line into separate robotic phrases.
    this.speaking=true;
    this.speakingEquipment=!!item.equipment;
    u.onend=()=>{ this.speaking=false; this.speakingEquipment=false; if(itemDone) try{itemDone();}catch(e){} setTimeout(()=>this.flush(),150); };
    u.onerror=()=>{ this.speaking=false; this.speakingEquipment=false; if(itemDone) try{itemDone();}catch(e){} setTimeout(()=>this.flush(),180); };
    speechSynthesis.speak(u);
  },
  reset(){
    this.queue.length=0;
    this.speaking=false;
    this.speakingEquipment=false;
    this.lastAudience=-999999;
    this.lastMilestone=64;
    if ('speechSynthesis' in window) speechSynthesis.cancel();
  },
  audience(n){
    const now=performance.now();
    if (now-this.lastAudience<28000) return;

    // Conversational lines are intentionally varied. They sound like a host
    // checking in with the room, rather than repeating an AI-style CTA.
    const lines = [
      'Alright, where are you watching from? Drop your country in the chat.',
      'I want to know who is still here. Where are you watching from?',
      'Is your country still in? Let me know in the comments.',
      'If you see your flag in there, you know what to do. Hit that like button.',
      'Still backing your country? Give the stream a like and keep watching.',
      'Who are you rooting for? Tell me your country in the comments.',
      'Keep those flags coming. Where are you watching from?',
      'If your country is still alive, make some noise in the chat.',
      'You enjoying this one? Drop a like and let us keep it going.',
      'I need to see those country names in the comments. Who is still alive?'
    ];
    this.lastAudience=now;
    this.say(lines[Math.floor(Math.random()*lines.length)]);
  },
  milestone(n){
    if (n===32 && this.lastMilestone>32){
      this.lastMilestone=32;
      this.say('Halfway there... down to the final thirty-two.', true);
    } else if (n===10 && this.lastMilestone>10){
      this.lastMilestone=10;
      this.say('Final ten countries now. This is getting serious.', true);
    } else if (n===5 && this.lastMilestone>5){
      this.lastMilestone=5;
      this.say('Final five! Who takes it home?', true);
    } else if (n===2 && this.lastMilestone>2){
      this.lastMilestone=2;
      this.say('It is down to the final two...', true);
    }
  },
  elimination(c){
    const n=alive().length;
    /* Elimination is visual-only: the on-screen elimination card is the voice-free
       equivalent of the old 'X is out' line. Milestone commentary remains normal
       tournament commentary and therefore retains priority. */
    this.milestone(n);
    // Let the elimination breathe before an audience line. This avoids the
    // clipped, machine-generated feeling of back-to-back announcements.
    const chance = n>10 ? 0.09 : n<=10 ? 0.15 : 0;
    if (Math.random()<chance){
      const delay = 850 + Math.random()*950;
      setTimeout(()=>this.audience(n), delay);
    }
  },
  shield(c){
    this.say(c.name+' is shielded.');
  },
  comeback(c){
    this.say(c.name+' is back in!', true);
  },
  event(type){
    if (type==='DOUBLE') this.say('Double draw! Two balls this round.', true);
    if (type==='TUMBLE') this.say('Tumble boost! Here we go.', true);
    if (type==='RAPID') this.say('Rapid fire! Things are moving fast.', true);
  },
  winner(c,onDone){
    if (!c || !this.enabled || !('speechSynthesis' in window)) { if(onDone) onDone(); return; }
    /* Winner speech is terminal for this battle: cancel every queued/active line
       so no stale audience/equipment commentary can interrupt it or duplicate it. */
    this.queue.length=0;
    try{ speechSynthesis.cancel(); }catch(e){}
    this.speaking=false; this.speakingEquipment=false;
    const u=new SpeechSynthesisUtterance(c.name+' wins!');
    u.voice=this.voice || undefined; u.rate=this.rate; u.pitch=this.pitch; u.volume=this.volume;
    this.speaking=true;
    let done=false;
    const finish=()=>{ if(done)return; done=true; this.speaking=false; this.speakingEquipment=false; if(onDone) try{onDone();}catch(e){} };
    u.onend=finish; u.onerror=finish;
    speechSynthesis.speak(u);
  }
};
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged=()=>COMMENTARY.pickVoice();

/* ==========================================================================
   4. STATE
   ========================================================================== */
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

let G = null;
function careers(){ try{ return JSON.parse(localStorage.getItem('cbr_wins')||'{}'); }catch(e){ return {}; } }
function addWin(code){ try{ const c=careers(); c[code]=(c[code]||0)+1; localStorage.setItem('cbr_wins',JSON.stringify(c)); }catch(e){} }

/* The opening layout. Two things here are deliberate and both were forced by measurement.

   sqrt() on the radius, not a flat rnd(): sampling r uniformly puts equal counts in equal
   RADIAL bands, which means the inner bands are packed far denser than the outer ones. At
   41.5% average packing that jams the middle, the 400-try budget runs out, and balls get
   placed on top of each other. sqrt(u) gives equal counts per unit AREA.

   Spoke clearance in the reject test: without it, the 64 opening positions ignored the six
   spokes completely, and since the spokes span r=261..463 that is most of the arena. The
   harness caught a ball 2.4 px from a spoke centreline - 47.814 px inside a 50.2 px
   clearance - on the first playing frame of a draw. */
function newDraw(){
  // Fisher-Yates over the whole pool, then take the first N_BALLS. Before this the code
  // read pool[i] in declaration order, so with a 100-entry pool the field would have been
  // the same first 64 every single round and the last 36 flags would never once appear.
  // Unbiased matters here: a lazy sort(()=>Math.random()-0.5) is NOT uniform, and a
  // country that is quietly rarer than the rest is exactly the kind of bug nobody sees.
  const pool = COUNTRIES.slice();
  for (let i=pool.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    const t=pool[i]; pool[i]=pool[j]; pool[j]=t;
  }
  const balls = [];
  const spokeA0 = rnd(0,Math.PI*2);
  const segs=[];
  for(let i=0;i<CFG.SPOKE_N;i++){
    const a=spokeA0+i*2*Math.PI/CFG.SPOKE_N, ca=Math.cos(a), sa=Math.sin(a);
    segs.push({ax:ca*CFG.SPOKE_IN, ay:sa*CFG.SPOKE_IN, bx:ca*CFG.SPOKE_OUT, by:sa*CFG.SPOKE_OUT});
  }
  const clearOfSpokes=(x,y)=>segs.every(s=>{
    const ex=s.bx-s.ax, ey=s.by-s.ay, L2=ex*ex+ey*ey;
    const t=clamp(((x-s.ax)*ex+(y-s.ay)*ey)/L2,0,1);
    return Math.hypot(x-(s.ax+ex*t), y-(s.ay+ey*t)) > CFG.SPOKE_CAP+CFG.BALL_R+1;
  });
  const rMin=CFG.HOLE_R+CFG.BALL_R+4, rMax=CFG.ARENA_R-CFG.BALL_R-8;
  for (let i=0;i<CFG.N_BALLS;i++){
    const c = pool[i];
    let x,y,tries=0;
    do{
      const a=rnd(0,Math.PI*2);
      const r=Math.sqrt(rnd(rMin*rMin/(rMax*rMax),1))*rMax;   // equal area density in [rMin,rMax]
      x=Math.cos(a)*r; y=Math.sin(a)*r; tries++;
    } while(tries<200 && (!clearOfSpokes(x,y)
            || balls.some(b=>(b.x-x)**2+(b.y-y)**2 < (CFG.BALL_R*2+1)**2)));
    const a2=rnd(0,Math.PI*2);
    balls.push({c, x, y, vx:Math.cos(a2)*CFG.BALL_SPEED, vy:Math.sin(a2)*CFG.BALL_SPEED, shield:false, alive:true});
  }
  G = {
    balls, dead: [],                     // dead = [{c}] in elimination order
    phase:'INTRO', tPhase:0, t:0,
    spokeA: spokeA0,                     // the same angle the layout was cleared against
    holeT:0,                             // 0..1 dilation
    closing:false,                       // the closing ramp; see closeHub()
    flash:0, banner:null, bannerT:0,
    pendingKills:[],                     // kills waiting to hit the HUD
    openKills:0, killQuota:1,
    rapidLeft:0, tumbleT:0,
    winner:null, drawStart:0, roundNo:(G?G.roundNo+1:1),
    shielded:null, comebackFx:0,
    shake:0,
    spawnSkips:0,                        // comebacks refused for want of a clear spot
  };
  G.settleResidual = settle(CFG.SETTLE);
  COMMENTARY.reset();
}

/* Positional-only relaxation of the opening layout: separate every overlapping pair, then
   push everything back out of the walls, repeat. No velocity, no time - this all happens
   before the first frame is drawn, so nothing pops on screen.

   Why this exists rather than a bigger try budget: the layout is provably not reachable by
   rejection sampling. Reachable area for a ball centre is the r=107.5..445.5 annulus minus
   the six spoke capsules at clearance 50.2 px, which is 428,563 px^2. Sixty-four balls need
   282,743 px^2 = 66% of it. Random sequential placement jams at 54.7%, so the search cannot
   succeed no matter how long it runs - but 66% is well under the 90.7% hexagonal maximum,
   which is exactly the regime where relaxation works and rejection does not.
   Returns the worst residual overlap so the caller can see the layout quality instead of
   assuming it; verify_sim.js asserts on it. */
function settle(iters){
  const A=alive(), segs=spokeSegs(), R2=CFG.BALL_R*2;
  for (let k=0;k<iters;k++){
    for (let i=0;i<A.length;i++) for (let j=i+1;j<A.length;j++){
      const a=A[i], b=A[j];
      const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy);
      if (d<R2){
        if (d<0.0001){ b.x+=rnd(-1,1); b.y+=rnd(-1,1); continue; }
        const nx=dx/d, ny=dy/d, ov=(R2-d)/2;
        a.x-=nx*ov; a.y-=ny*ov; b.x+=nx*ov; b.y+=ny*ov;
      }
    }
    for (const b of A) project(b, false, segs, G.spokeA);
  }
  // read-only measurement of what is actually left, AFTER the last wall pass - a residual
  // measured before the final projection would not be the residual the game starts with.
  let worst=0;
  for (let i=0;i<A.length;i++) for (let j=i+1;j<A.length;j++)
    worst=Math.max(worst, R2-Math.hypot(A[j].x-A[i].x, A[j].y-A[i].y));
  return worst;
}
function alive(){ return G.balls.filter(b=>b.alive); }

/* ==========================================================================
   5. PHYSICS
   ========================================================================== */
function spokeSegs(){
  const segs=[];
  for(let i=0;i<CFG.SPOKE_N;i++){
    const a = G.spokeA + i*2*Math.PI/CFG.SPOKE_N;
    const ca=Math.cos(a), sa=Math.sin(a);
    segs.push({ax:ca*CFG.SPOKE_IN, ay:sa*CFG.SPOKE_IN, bx:ca*CFG.SPOKE_OUT, by:sa*CFG.SPOKE_OUT});
  }
  return segs;
}

/* Only the angularly nearest spoke can ever touch a given ball, so the solver tests one
   spoke instead of six. This is exact, not an approximation: spokes are 60 deg apart, the
   required clearance is SPOKE_CAP+BALL_R = 50.2 px, and the two nearest spoke surfaces are
   never closer together than 2*pi*261/6 = 273 px (at the inner caps, their tightest point).
   So two spokes cannot both be within 50.2 px of one ball. */
function nearSpoke(b, segs, base){
  let k = Math.round((Math.atan2(b.y,b.x) - base) / (Math.PI/3));
  return segs[((k % CFG.SPOKE_N) + CFG.SPOKE_N) % CFG.SPOKE_N];
}

/* Positional projection onto every solid surface. Position only, no velocity change.
   Order is spokes -> rim so the RIM is exact: it is the most visible wall and a
   ball outside it reads as a bug instantly. One static fact (asserted in verify_sim.js)
   makes that order safe rather than lucky: a ball centre can never exceed r=445.5 while
   a spoke tip sits at r=463, so the closest point on a spoke is never its outer cap and
   the push-out is always perpendicular to the radius. It cannot fight the rim clamp.
   The hub is NOT a surface - see the note above closeHub(). */
function project(b, open, segs, base){
  const minS = CFG.SPOKE_CAP + CFG.BALL_R;
  const s = nearSpoke(b, segs, base);
  const ex=s.bx-s.ax, ey=s.by-s.ay, L2=ex*ex+ey*ey;
  let t=((b.x-s.ax)*ex+(b.y-s.ay)*ey)/L2; t=clamp(t,0,1);
  const px=s.ax+ex*t, py=s.ay+ey*t;
  let nx=b.x-px, ny=b.y-py, dd=Math.hypot(nx,ny);
  if (dd<minS){
    if (dd<0.0001){ nx=-py; ny=px; dd=Math.hypot(nx,ny)||1; }
    b.x=px+nx/dd*minS; b.y=py+ny/dd*minS;
  }
  const d=Math.hypot(b.x,b.y);
  const lim=CFG.ARENA_R-CFG.BALL_R;
  if (d>lim && d>0.0001){ b.x=b.x/d*lim; b.y=b.y/d*lim; }
}

/* Uniform-grid broadphase. Built once per substep and reused across every relaxation
   pass: 64 balls is 2016 brute-force pairs but only ~200 real candidates, and the
   relaxation loop runs 5x per substep at 120 Hz, so the saving is ~10x. */
function broadphase(A, cell){
  const m = new Map(), out = [];
  for (let i=0;i<A.length;i++){
    const b=A[i]; b.__i=i;
    b.__gx=Math.floor(b.x/cell)+64; b.__gy=Math.floor(b.y/cell)+64;
    const k=b.__gx*1024+b.__gy;
    let l=m.get(k); if(!l){ l=[]; m.set(k,l); } l.push(b);
  }
  for (const b of A){
    for (let dx=0; dx<=1; dx++) for (let dy=-1; dy<=1; dy++){
      if (dx===0 && dy<0) continue;                 // half neighbourhood: each pair once
      const l=m.get((b.__gx+dx)*1024+(b.__gy+dy)); if(!l) continue;
      for (const o of l){
        if (dx===0 && dy===0 && o.__i<=b.__i) continue;
        out.push(b,o);
      }
    }
  }
  return out;
}

/* The one definition of "how fast a ball is allowed to be", so the physics pin and every
   spawn path cannot disagree. They did: the tumble grant and the comeback spawn each wrote
   BALL_SPEED directly, and verify_sim.js caught the gap as a speed error of exactly
   1 - 1/TUMBLE_SPEED = 35.4839%. Two copies of a rule is one copy too many. */
function curSpeed(){ return CFG.BALL_SPEED * (G.tumbleT>0?CFG.TUMBLE_SPEED:1); }
function pinTo(b, sp){
  const m=Math.hypot(b.vx,b.vy);
  if (m<0.001){ const a=rnd(0,Math.PI*2); b.vx=Math.cos(a)*sp; b.vy=Math.sin(a)*sp; }
  else { b.vx=b.vx/m*sp; b.vy=b.vy/m*sp; }
}

/* A revived ball must not appear inside a wall, inside another ball, or inside the mouth.
   The first build spawned at a fixed r = ARENA_R-BALL_R-6 = 439.5 px, which lies inside the
   spoke span 261..463 - so a comeback could materialise in the middle of a rotating spoke.
   verify_sim.js caught it: 47.204 px of spoke penetration (the theoretical maximum is
   SPOKE_CAP+BALL_R = 50.2) and 38.759 px of ball-ball overlap, both on comeback frames.
   Rejection sampling, uniform over the disc (sqrt for equal area density, not equal radius
   density), keeping the roomiest candidate so the search always terminates. Returns null
   only if the arena is genuinely too full, in which case the comeback is skipped and
   counted rather than forced. */
function freeSpot(self){
  const segs=spokeSegs(), A=alive(), rmax=CFG.ARENA_R-CFG.BALL_R-2;
  let best=null, bestClr=-1e9;
  for (let k=0;k<400;k++){
    const a=rnd(0,Math.PI*2), r=Math.sqrt(rnd(0,1))*rmax;
    const x=Math.cos(a)*r, y=Math.sin(a)*r;
    let clr = Math.hypot(x,y) - (CFG.HOLE_R+CFG.BALL_R);   // never into the mouth: that would
    for (const s of segs){                                 // hand the opening a second kill
      const ex=s.bx-s.ax, ey=s.by-s.ay, L2=ex*ex+ey*ey;
      let t=((x-s.ax)*ex+(y-s.ay)*ey)/L2; t=clamp(t,0,1);
      const d=Math.hypot(x-(s.ax+ex*t), y-(s.ay+ey*t)) - (CFG.SPOKE_CAP+CFG.BALL_R);
      if (d<clr) clr=d;
    }
    for (const o of A){
      if (o===self) continue;
      const d=Math.hypot(x-o.x,y-o.y) - CFG.BALL_R*2;
      if (d<clr) clr=d;
    }
    if (clr>bestClr){ bestClr=clr; best={x,y}; }
    if (clr>1.5) return {x,y};
  }
  return bestClr>1.5 ? best : null;
}

function step(dt){
  const om = (CFG.SPOKE_DEG_S*Math.PI/180) * (G.tumbleT>0?CFG.TUMBLE_SPIN:1);
  G.spokeA = (G.spokeA + om*dt) % (Math.PI*2);      // wrapped every step: no float drift over days
  const speed = curSpeed();
  const open = (G.phase==='OPEN');
  const segs = spokeSegs();
  const base = G.spokeA;
  const A = alive();

  for (const b of A){
    /* Suction: an inward acceleration for the whole OPEN phase, falling off as a 2-D point
       sink (1/r, normalised at the hole edge). Because |v| is pinned below, this is pure
       steering - it rotates the heading toward the centre and never changes the speed.
       Applied for the whole phase including the closing ramp, because that is exactly
       the window over which the reference's -50.6 px/s inward drift was measured.

       CLOSING THE ORBIT LOOPHOLE. Pinned |v| plus a constant inward acceleration has an
       exact stable circular orbit at r = v^2/a = 230^2/190 = 278 px. A ball that arrives
       there moving tangentially stays there: suction turns the heading but can never
       shorten the radius, so it orbits outside the 66 px mouth indefinitely. In a crowd
       this is invisible because collisions break the orbit within a frame or two. With two
       survivors there is nothing left to perturb it, which is why sparse openings had a
       61.6 s tail while the reference's longest is 5.71 s.

       Making the orbit fit inside the mouth needs v^2/HOLE_R = 802 px/s^2, 4.2x SUCTION,
       which would ruin the crowded timing that IS calibrated (0.97 s, matched exactly).
       So instead the pull ramps up with how long this opening has already run. Balls in
       the reference are eaten quickly, so the ramp is dormant during the window every
       measured target came from: at 1 s it is 1.0x, and it only reaches the orbit-breaking
       4.2x near 6 s - past the reference's longest opening, and only ever reached in the
       stalled two-ball case this exists to resolve. */
    if (open){
      const d=Math.hypot(b.x,b.y);
      if (d>1){
        const urge = 1 + CFG.SUCTION_RAMP*Math.max(0, G.tPhase/1000 - 1);
        const a = CFG.SUCTION * urge *
                  Math.pow(CFG.SUCTION_R0/Math.max(d,CFG.SUCTION_R0), CFG.SUCTION_FALL);
        b.vx -= (b.x/d)*a*dt; b.vy -= (b.y/d)*a*dt;
      }
    }
    b.x += b.vx*dt; b.y += b.vy*dt;

    // --- rim ---
    const d=Math.hypot(b.x,b.y), lim=CFG.ARENA_R-CFG.BALL_R;
    if (d>lim){
      const nx=b.x/d, ny=b.y/d;
      b.x=nx*lim; b.y=ny*lim;
      const vn=b.vx*nx+b.vy*ny; if(vn>0){ b.vx-=2*vn*nx; b.vy-=2*vn*ny; }
    }
    // --- no hub term: the hub is floor, not obstacle. Measured, see closeHub(). ---
    // --- spoke: rotating capsule, with the surface velocity added in ---
    {
      const s = nearSpoke(b, segs, base);
      const ex=s.bx-s.ax, ey=s.by-s.ay;
      const L2=ex*ex+ey*ey;
      let t=((b.x-s.ax)*ex+(b.y-s.ay)*ey)/L2; t=clamp(t,0,1);
      const px=s.ax+ex*t, py=s.ay+ey*t;
      let nx=b.x-px, ny=b.y-py;
      let dist=Math.hypot(nx,ny);
      const min=CFG.SPOKE_CAP+CFG.BALL_R;
      if (dist<min){
        if (dist<0.001){ nx=-py; ny=px; dist=Math.hypot(nx,ny)||1; }
        nx/=dist; ny/=dist;
        b.x=px+nx*min; b.y=py+ny*min;
        // surface velocity of the rotating spoke at the contact point
        const svx=-om*py, svy=om*px;
        const rvx=b.vx-svx, rvy=b.vy-svy;
        const vn=rvx*nx+rvy*ny;
        if (vn<0){ b.vx=rvx-2*vn*nx+svx; b.vy=rvy-2*vn*ny+svy; }
      }
    }
  }

  // --- positional solve ----------------------------------------------------
  // Interleaved: separate overlapping pairs, then re-project onto every wall.
  // The ORDER matters and the first build had it wrong - the pair pass ran last, so a
  // crowd at the centre could shove a ball back inside the hub and it stayed there.
  // verify_sim.js found a 97 px penetration. Walls must have the final word.
  const R2=(CFG.BALL_R*2);
  const pairs = broadphase(A, R2 + speed*dt*2 + 6);
  for (let pass=0; pass<CFG.RELAX; pass++){
    for (let k=0;k<pairs.length;k+=2){
      const a=pairs[k], b=pairs[k+1];
      const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy);
      if (d<R2 && d>0.0001){
        const nx=dx/d, ny=dy/d, ov=(R2-d)/2;
        a.x-=nx*ov; a.y-=ny*ov; b.x+=nx*ov; b.y+=ny*ov;
        if (pass===0){
          const va=a.vx*nx+a.vy*ny, vb=b.vx*nx+b.vy*ny;
          if (va-vb>0){ const p=va-vb;
            a.vx-=p*nx; a.vy-=p*ny; b.vx+=p*nx; b.vy+=p*ny; }
        }
      }
    }
    for (const b of A) project(b, open, segs, base);
  }

  // --- pin |v| (see header note) -------------------------------------------
  for (const b of A) pinTo(b, speed);

  // --- the hole eats -------------------------------------------------------
  // Purely geometric: a ball dies when its centre is inside the current hole. There is
  // no extra threshold - the dilation ramp alone makes an instant kill rare, and the
  // reference gives me the hole radius but not a "lethal fraction" of it.
  if (open && !G.closing && G.holeT>0){
    const rr = CFG.HOLE_R*G.holeT;
    for (const b of A){
      if (Math.hypot(b.x,b.y) < rr){
        if (b.shield){                       // shielded: ejected, shield breaks
          b.shield=false; G.shielded=null;
          const d=Math.hypot(b.x,b.y)||1;
          const ux=b.x/d, uy=b.y/d;
          b.x=ux*(CFG.HOLE_R+CFG.BALL_R+20); b.y=uy*(CFG.HOLE_R+CFG.BALL_R+20);
          b.vx=ux*speed; b.vy=uy*speed;
          showBanner('SHIELD HELD','#5ef2c8'); SFX.shield();
          beginClosing();                    // an opening spent with no kill
        } else {
          kill(b);
          if (G.openKills>=G.killQuota) beginClosing();
        }
        break;
      }
    }
  }
}

/* ==========================================================================
   6. GAME FLOW
   ========================================================================== */
function showBanner(text, color){ G.banner={text,color:color||PAL.gold}; G.bannerT=CFG.BANNER_MS; }

function kill(b){
  b.alive=false; G.openKills++;
  G.dead.push({c:b.c});
  G.flash=1; G.shake=Math.max(G.shake,12);
  setTimeout(()=>{ if(G) G.pendingKills.push(b.c); }, CFG.HUD_DELAY_MS);
  if (G.killQuota>1 && G.openKills===2) SFX.double(); else SFX.kill();
  G.lastKill={c:b.c, t:0}; setLiveKillCard(b.c);
  COMMENTARY.elimination(b.c);
}

/* THE HUB IS NOT A COLLIDER. This is measured, and it replaced a wrong first build.

   I originally assumed the closed hub was a solid disc. It is not: in the reference,
   balls roll straight across it. Over 484 steady-CLOSED frames (phase read from the ring
   hue, +-1 s around every phase edge discarded so a half-closed hole cannot fake it) there
   are 50 ball-sized, ball-shaped blobs whose centres lie inside r=88 capture px - the
   closest approach a wall would allow - and 43 of those are strictly inside the hub disc.
   The closest sits at r=4.6 capture = 9 design px, dead centre, and at t=284.00..284.50 a
   single ball tracks r = 16.9, 8.1, 4.6, 11.3, 19.8: a clean chord through the middle while
   the ring is gold. Confirmed by eye too, in vid/hub_top.png.

   So the hub disc is floor. Only the open hole is lethal. That removes three things the
   first build needed: the hub collision term, the "wait until the hub is clear before
   closing" tail, and closeHub()'s ejection sweep. The tail was the worse mistake - a probe
   showed 6-12 of 64 balls are over the hub at any instant, so "wait until clear" could
   never fire and every opening ran to its 4 s deadlock guard, inflating open durations ~5x
   and diluting the inward-drift signal to zero.

   What remains is the shrink ramp, which is now just the closing animation: it mirrors the
   dilation rate (no new constant) and stops being lethal immediately, so the quota is never
   exceeded by a ball that wanders in while the hole is disappearing. */
function beginClosing(){ G.closing=true; }

function closeHub(){
  G.phase='CLOSED'; G.tPhase=0; G.holeT=0; G.openKills=0; G.killQuota=1; G.closing=false;
  if (G.rapidLeft>0) G.rapidLeft--;
}

function openHub(){
  G.phase='OPEN'; G.tPhase=0; G.openKills=0; G.killQuota=1; G.closing=false; SFX.open();
  const n = alive().length;
  // event rolls. guards keep a draw from ending without a winner.
  if (n>3 && Math.random()<CFG.P_DOUBLE){ G.killQuota=2; showBanner('DOUBLE DRAW','#ff9f1c'); COMMENTARY.event('DOUBLE'); }
  if (n>2 && !G.shielded && Math.random()<CFG.P_SHIELD){
    const A=alive(); const b=A[Math.floor(Math.random()*A.length)];
    b.shield=true; G.shielded=b; showBanner('SHIELDED · '+b.c.name, PAL.shield); SFX.shield(); COMMENTARY.shield(b.c);
  }
  if (Math.random()<CFG.P_TUMBLE){
    G.tumbleT=CFG.TUMBLE_MS; G.shake=18; showBanner('TUMBLE BOOST','#ffd34d'); SFX.tumble(); COMMENTARY.event('TUMBLE');
    // Boost NOW, not on the next physics step. openHub() runs AFTER step() inside tick(), so
    // deferring left one frame where tumbleT>0 while every |v| was still the base speed.
    for (const b of alive()) pinTo(b, curSpeed());
  }
  if (G.rapidLeft<=0 && n>8 && Math.random()<CFG.P_RAPID){ G.rapidLeft=CFG.RAPID_N; showBanner('RAPID FIRE','#ff4d6d'); SFX.rapid(); COMMENTARY.event('RAPID'); }
  if (n>=4 && G.dead.length>=6 && Math.random()<CFG.P_COMEBACK){
    const i=Math.floor(Math.random()*G.dead.length);
    const b=G.balls.find(x=>x.c.code===G.dead[i].c.code);
    const p=b?freeSpot(b):null;
    if (p){
      const c=G.dead.splice(i,1)[0].c;      // splice only on success: the first build removed
      b.alive=true; b.shield=false;         // the country first, so a failed revive deleted it
      b.x=p.x; b.y=p.y;                     // from the eliminated grid and it never came back
      const a2=rnd(0,Math.PI*2), sp=curSpeed();
      b.vx=Math.cos(a2)*sp; b.vy=Math.sin(a2)*sp;
      G.comebackFx=1; showBanner('COMEBACK · '+c.name,'#5ef2c8'); SFX.comeback(); COMMENTARY.comeback(c);
    } else G.spawnSkips++;                  // no room, or no such ball: reported, not forced
  }
}

function tick(dtms){
  const dt=dtms/1000;
  G.t+=dtms; G.tPhase+=dtms;
  if (G.bannerT>0) G.bannerT-=dtms;
  if (G.tumbleT>0) G.tumbleT-=dtms;
  if (G.flash>0) G.flash=Math.max(0,G.flash-dtms/CFG.FLASH_MS);
  if (G.shake>0) G.shake=Math.max(0,G.shake-dtms*0.05);
  if (G.comebackFx>0) G.comebackFx=Math.max(0,G.comebackFx-dtms/700);
  if (G.lastKill) G.lastKill.t+=dtms;

  if (G.phase==='INTRO'){
    if (G.tPhase>=CFG.INTRO_MS){ G.phase='CLOSED'; G.tPhase=0; G.drawStart=performance.now(); }
    return;
  }
  if (G.phase==='WINNER'){
    if (G.tPhase>=CFG.WINNER_MS) newDraw();
    return;
  }

  // physics only while playing
  let acc = dtms/1000;
  while (acc >= CFG.DT){ step(CFG.DT); acc-=CFG.DT; }
  if (acc>0) step(acc);

  if (G.phase==='CLOSED'){
    const dur = G.rapidLeft>0 ? CFG.RAPID_CLOSED : CFG.CLOSED_MS;
    if (G.tPhase>=dur) openHub();
  } else if (G.phase==='OPEN'){
    if (G.closing){
      G.holeT = Math.max(0, G.holeT - dtms/CFG.HOLE_OPEN_MS);
      if (G.holeT<=0) closeHub();              // nothing to wait for: the hub is floor
    } else {
      G.holeT = Math.min(1, G.tPhase/CFG.HOLE_OPEN_MS);
    }
  }

  if (alive().length<=1 && G.phase!=='WINNER'){
    const w=alive()[0];
    if (w){ G.winner={c:w.c, lasted:(performance.now()-G.drawStart)/1000};

const cv=document.getElementById('c'), ctx=cv.getContext('2d');
function fit(){
  const s=Math.min(innerWidth/W, innerHeight/H);
  cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px';
}
addEventListener('resize',fit); fit();

function roundRect(g,x,y,w,h,r){ g.beginPath();
  g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

/* ---- backdrop photo ---------------------------------------------------------
   The only binary asset in the build. Two things are deliberate:

   (1) `typeof Image` guard. Every headless harness (verify_sim.js, calibrate.js,
       flag_trace.js, ...) evaluates this <script> inside a Node vm sandbox that has
       no Image constructor. Feature-detecting here keeps all of them working with
       zero changes, and costs one comparison at load.
   (2) bgOk stays false until the decode actually succeeds, and drawBackdrop()
       falls back to the procedural starfield. A missing or corrupt bg.jpg degrades
       the look; it cannot stop the stream.

   Sizing needs no cover-fit maths: the source art is 900x1600 and the canvas is
   1080x1920. Both are exactly 9:16 (0.562500), so a straight scale to W,H covers
   with zero crop and zero letterbox - checked in bg_scrim.py, which asserts it. */
const BG = (typeof Image === 'function') ? new Image() : null;
let bgOk = false;
if (BG){
  BG.onload  = () => { bgOk = BG.naturalWidth > 0 && BG.naturalHeight > 0; };
  BG.onerror = () => { bgOk = false; };
  BG.src = 'bg.jpg';
}

function drawBackdrop(){
  if (bgOk){
    ctx.drawImage(BG, 0, 0, W, H);
    /* Scrim alpha 0.46 is MEASURED, not chosen. Two steps, in this order:

       bg_scrim.py first tested the obvious argument - white HUD text over the
       bright shirt and nebula - and REFUTED it. In this artwork every band where
       white text lands is already near-black (worst band p95 luminance 0.037,
       i.e. 12.1:1 against white) because the bright regions sit behind the ARENA,
       not behind the header. With no scrim at all the worst case is 14.99:1, far
       past the 3:1 that WCAG asks of large bold text. So contrast does not set it.

       bg_match.py therefore measured the dimming in the mockup Dell supplied as
       the target, by least-squares fitting mockup = k*photo + c over 155 blocks
       that lie outside both rings and outside every panel:
           R alpha 0.504   G 0.448   B 0.420   ->  mean 0.457   (rms 19-28/255)
       0.46 is that figure. The fit also implies a scrim colour near rgb(30,22,25),
       but that intercept is inside its own residual noise, so this keeps the
       arena's blue-black instead of inventing a warm grey from it. */
    ctx.fillStyle = 'rgba(6,9,24,0.46)'; ctx.fillRect(0,0,W,H);
    return;
  }
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0a0f24'); g.addColorStop(0.5,'#131a3a'); g.addColorStop(1,'#080b1a');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // deterministic starfield so nothing accumulates over days
  ctx.fillStyle='rgba(255,255,255,0.55)';
  let s=12345;
  for(let i=0;i<170;i++){
    s=(s*1103515245+12345)&0x7fffffff;
    const x=(s%W), y=((s>>9)%H), r=((s>>17)%3)*0.5+0.4;
    ctx.globalAlpha=0.20+((s>>5)%60)/160;
    ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;
}

/* ---- text that cannot overflow ----------------------------------------------
   `system-ui` resolves to a different face on every machine - Segoe UI on Windows,
   SF on macOS, whatever fontconfig picks inside an OBS build on Linux - and their
   advance widths differ by well over 10%. Any layout that hard-codes an x position
   for a string is one machine away from a collision. So set the size from the
   measured width of the actual string, then draw.
   Returns the px size used, so callers can position the next segment. */
function fitFont(text, maxW, size, weight, extra){
  const stack = (extra||'') + 'system-ui,sans-serif';
  for (let s=size; s>12; s--){
    ctx.font = weight+' '+s+'px '+stack;
    if (ctx.measureText(text).width <= maxW) return s;
  }
  return 12;
}

function drawHub(){
  const {CX,CY,HUB_R}=CFG;
  const open = (G.phase==='OPEN');
  ctx.save(); ctx.translate(CX,CY);
  // pinwheel (8 slices), lit when closed
  ctx.save(); ctx.rotate(G.spokeA*0.6);
  for(let i=0;i<8;i++){
    ctx.beginPath(); ctx.moveTo(0,0);
    ctx.arc(0,0,HUB_R-8, i*Math.PI/4, (i+1)*Math.PI/4); ctx.closePath();
    ctx.fillStyle = (i%2===0)
      ? (open?'rgba(70,40,80,0.75)':'rgba(150,140,220,0.55)')
      : (open?'rgba(45,25,55,0.75)':'rgba(112,102,190,0.55)');

  }
  ctx.restore();
  // the hole
  if (open && G.holeT>0){
    const r=CFG.HOLE_R*G.holeT;
    const hg=ctx.createRadialGradient(0,0,1,0,0,r);
    hg.addColorStop(0,'#000000'); hg.addColorStop(0.75,'#05030a'); hg.addColorStop(1,'rgba(20,8,30,0.9)');
    ctx.fillStyle=hg; ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.fill();

  ctx.lineWidth=9;
  ctx.strokeStyle = open? PAL.hubMag : PAL.hubGold;
  ctx.shadowColor = open? 'rgba(255,62,165,0.75)' : 'rgba(245,194,59,0.6)';
  ctx.shadowBlur = open? 26 : 14;
  ctx.beginPath(); ctx.arc(0,0,HUB_R,0,7); ctx.stroke();
  ctx.shadowBlur=0; ctx.restore();
}

/* ---- header layout ----------------------------------------------------------
   The first build stacked the brand on two lines, then the panels below it, and
   only then the prompt. That pushed "WHERE ARE / YOU FROM?" to baselines 412 and
   466 - and the arena's top edge is at

       CY - ARENA_R = 860 - 483 = 377

   so both lines were drawn INSIDE the ring. It was not a near miss: the panels
   already ended at 236+118 = 354, leaving a 23 px band, and two lines of 46 px
   text need ~120 px. There was nowhere for the prompt to go.

   The fix is the arrangement the target mockup uses: brand, both panels and the
   gauge share ONE row, which buys back the whole band the second brand line and
   the panel row used to occupy. The arena does not move, so every measured
   constant (ARENA_R, CX, CY) and everything below the ring is untouched.

   Horizontal budget, left to right, summing to exactly 1080:
       28 margin + 416 brand + 24 + 210 panel + 16 + 210 panel + 36 + 92 gauge + 48
   Vertical, with the clearances layout_check.js asserts against y=377:
       row      30 .. 148
       status  178 .. 206   (cap top .. descent)   30 px below the row
       prompt  225 .. 338   (line 1 cap top .. line 2 descent)   39 px above 377 */
const LAY = {
  rowY:30, rowH:118, brandX:28, brandW:416,
  p1X:468, p2X:694, pW:210,
  gx:986, gy:89, gr:46,
  statusY:200, statusF:30,
  promptY1:258, promptF1:46,
  promptY2:326, promptF2:58,
};

function drawHUD(){
  const L=LAY;

  // ---- brand: ONE line, two colours, one baseline -------------------------
  // Sized from the measured width of the real string so it cannot spill into the
  // COUNTRIES panel on a machine whose system-ui is wider than mine.
  ctx.save();
  ctx.textAlign='left';
  const bs = fitFont('FLAGS WAR ARENA', L.brandW, 52, '900');
  const by = L.rowY + L.rowH/2 + bs*0.36;      // optical centre of a caps-only line
  ctx.shadowColor='rgba(0,0,0,0.7)'; ctx.shadowBlur=10;
  ctx.font='900 '+bs+'px system-ui,sans-serif';
  ctx.fillStyle=PAL.ink;  ctx.fillText('FLAGS WAR ', L.brandX, by);
  const w1=ctx.measureText('FLAGS WAR ').width;
  ctx.fillStyle=PAL.gold; ctx.fillText('ARENA', L.brandX+w1, by);
  ctx.restore();

  const activeCount = G && Array.isArray(G.balls) ? G.balls.filter(b=>b.alive).length : 32;
  panel(L.p1X, L.rowY, L.pW, L.rowH, 'COUNTRIES', String(activeCount));
  panel(L.p2X, L.rowY, L.pW, L.rowH, 'REMAINING', String(activeCount), PAL.gold);

  // gauge
  ctx.textAlign='center';
  const gx=L.gx, gy=L.gy, gr=L.gr;
  ctx.save();
  ctx.lineWidth=12; ctx.strokeStyle='rgba(255,255,255,0.12)';
  ctx.beginPath(); ctx.arc(gx,gy,gr,0,7); ctx.stroke();
  if (G.phase==='OPEN'){
    ctx.strokeStyle=PAL.hubMag; ctx.beginPath(); ctx.arc(gx,gy,gr,0,7); ctx.stroke();
    ctx.fillStyle=PAL.hubMag; ctx.font='900 56px system-ui,sans-serif'; ctx.fillText('!',gx,gy+20);
  } else {
    const dur = G.rapidLeft>0?CFG.RAPID_CLOSED:CFG.CLOSED_MS;
    const left = Math.max(0, dur-G.tPhase), frac=1-left/dur;
    ctx.strokeStyle=PAL.hubGold;
    ctx.beginPath(); ctx.arc(gx,gy,gr,-Math.PI/2,-Math.PI/2+frac*Math.PI*2); ctx.stroke();
    ctx.fillStyle=PAL.ink; ctx.font='900 46px system-ui,sans-serif';
    ctx.fillText(String(Math.ceil(left/1000)), gx, gy+17);   // ceil(): matches the reference's 0.13s "5"
  }
  ctx.restore();

  // ---- status slot --------------------------------------------------------

function updateEquipment(dt){
  if(!G) return;
  const now=G.t/1000;
  autoEquipElapsed=now;
  // The automatic Circular Ring equipment cycle exists only during
  // qualification. It pauses during all knockout/bronze/final stages and
  // resumes with the fresh tournament after the podium/leaderboard.
  if(G.stage==='qualifying' && G.phase!=='INTRO' && (G.phase==='CLOSED'||G.phase==='OPEN')){
    while(now>=autoEquipNext){
      spawnEquip(EQUIPMENT[autoEquipIndex%EQUIPMENT.length][0],null);
      autoEquipIndex=(autoEquipIndex+1)%EQUIPMENT.length;
      autoEquipNext+=10;
    }
  }
  for(let i=equipPickups.length-1;i>=0;i--){
    const p=equipPickups[i];
    p.y+=132*dt; p.wob+=dt;
    if(p.y>insideDiscYLocal(p.x).bottom-6){equipPickups.splice(i,1);continue;}
    let taken=null;
    for(const b of G.balls){if(b.alive&&Math.hypot(b.x-p.x,b.y-p.y)<b.r+p.r){taken=b;break;}}
    if(!taken) continue;
    equipPickups.splice(i,1);
    applyEquipment(taken,p.kind);
  }
  updateSpecialEquipment(dt);
}

/* ----------------------------- chat admission ---------------------------- */
const CHAT_ITEMS={
  shield:/\bshield\b/i, revive:/\b(revive|revival|comeback)\b/i, bomb:/\bbombs?\b/i, sword:/\b(knife|sword|katana)\b/i,
  shotgun:/\b(shortgun|shotgun)\b/i, sniper:/\bsnipers?\b/i, fireRing:/\bfire ring\b/i, forceField:/\bforce ?field\b/i,
  twinAxes:/\btwin axes?\b/i, hammer:/\bhammer\b/i, tornado:/\btornados?\b/i, magnetic:/\bmagnetic( field)?\b/i,
  meteor:/\bmeteor( shower)?\b/i, spinningShield:/\bspinning shield\b/i, flameSword:/\bflame sword\b/i, boomerang:/\bboomerang( blade)?\b/i,
  lightning:/\blightning( chain)?\b/i, iceBlast:/\bice blast\b/i, shadowClone:/\bshadow clone\b/i, portal:/\bportals?\b/i,
  trident:/\btridents?\b/i, mineLayer:/\bmine( layer)?s?\b/i, circularSaw:/\bcircular saws?\b/i, dragonAura:/\bdragon aura\b/i, shockwave:/\bshock ?wave\b/i

function parseChat(text){
  const out={country:codeFor(text),items:[]};
  for(const k of Object.keys(CHAT_ITEMS))if(CHAT_ITEMS[k].test(text))out.items.push(k);
  return out;
}
function userKey(u){return String(u||'viewer').trim().toLowerCase();}
function enqueueWaiting(user,code){
  if(!code)return;

  if(waitingList.some(x=>userKey(x.user)===userKey(user))||currentChatUsers.has(userKey(user)))return;
  waitingList.push({key:k,user:String(user||'viewer'),code});

function addChatBall(user,code,fromWaiting){
  if(!G||G.phase!=='CLOSED'&&G.phase!=='OPEN')return false;
  if(G.balls.filter(b=>b.alive).length>=MAX_FLAGS)return false;
  if(G.balls.filter(b=>b.alive&&b.custom).length>=32)return false;
  const uk=userKey(user); if(currentChatUsers.has(uk))return false;
  const c=COUNTRIES.find(x=>x.code===code);if(!c)return false;
  let x,y,tries=0;const rMin=CFG.HOLE_R+CFG.BALL_R+12,rMax=CFG.ARENA_R-CFG.BALL_R-12;
  do{const a=rnd(0,Math.PI*2),r=Math.sqrt(rnd(.05,1))*rMax;x=Math.cos(a)*r;y=Math.sin(a)*r;tries++;}while(tries<300 && G.balls.some(b=>b.alive&&Math.hypot(b.x-x,b.y-y)<CFG.BALL_R*2+3));

function handleChat(user,text){
  const p=parseChat(text),uk=userKey(user);
  if(!p.country && !p.items.length)return;
  if(G && p.country){
    const key=uk+'|'+p.country;wildcardMentions[key]=(wildcardMentions[key]||0)+1;
    if((G.phase==='CLOSED'||G.phase==='OPEN') && G.stage==='qualifying' && G.roundTime>=300 && wildcardMentions[key]>=WILDCARD_TRIGGER && !alphaCountries.has(p.country)){
      alphaCountries.add(p.country);spawnAlpha(p.country,user);return;
    }
  }
  // No chat-triggered equipment, shield/revival, or other chat power may
  // spawn/activate during knockout, bronze, or final stages. Chat can still
  // populate the waiting list for the next qualification cycle.
  if(p.items.length && G && G.stage==='qualifying'){for(const k of p.items){
    if(k==='shield'||k==='revive'){
      if(!p.country) continue;
      const key=abilityKey(user,p.country,k);
      chatAbilityCounts[key]=(chatAbilityCounts[key]||0)+1;
      if(chatAbilityCounts[key]>=CHAT_ABILITY_TRIGGER){
        chatAbilityCounts[key]-=CHAT_ABILITY_TRIGGER;
        const ok=k==='shield'?grantShield(user,p.country):reviveFor(user,p.country);
        if(!ok && k==='revive'){ pendingRevivalTokens[key]=(pendingRevivalTokens[key]||0)+1; showBanner('REVIVAL READY · '+p.country+' · '+(pendingRevivalTokens[key]||0),'#5ef2c8'); }
        else if(!ok && k==='shield') showBanner('SHIELD READY BUT FLAG UNAVAILABLE · '+shieldUses+'/10','#5ef2c8');
      }

    else spawnEquip(k,user);
  }}
  if(!p.country||!G||G.phase==='WINNER')return;
  const active=G.balls.filter(b=>b.alive).length;
  if(['WINNER','PODIUM','LEADERBOARD'].includes(G.phase))return;
  if(currentChatUsers.has(uk)){
    const b=currentChatUsers.get(uk);if(b&&b.alive&&b.c.code===p.country){b.level=Math.min(3,(b.level||1)+1);b.scale=b.level===3?1.65:b.level===2?1.28:1;showBanner(b.level===3?'BIG FLAG · '+b.c.name:'FLAG BOOST · '+b.c.name,'#ffd75a'); if(b.level===3) COMMENTARY.say('Giant flag spawned for '+b.c.name+'!');}
    return;
  }
  const customCount=G.balls.filter(b=>b.custom).length;
  const totalChatSlots=32;
  if(G.stage==='qualifying' && (G.phase==='CLOSED'||G.phase==='OPEN') && active<MAX_FLAGS && customCount < totalChatSlots && (waitingJoined + freshJoined) < totalChatSlots){
    // Waiting-list entries are chat-driven too: they are admitted first, but never
    // inflate the round-start roster. This preserves exactly 32 at round start.
    const queued=waitingList.shift();
    if(queued && !currentChatUsers.has(userKey(queued.user)) && !G.balls.some(b=>b.alive&&userKey(b.user)===userKey(queued.user))){
      if(addChatBall(queued.user,queued.code,true)) return;

/* The prior newDraw has already run once before this layer loads. Replace it and

const oldKill=kill, oldStep=step;
function kill(b,cause){

     Therefore only a gate/rim kill contributes to the current opening's kill quota. */
  const gateCause = !cause || cause==='rim' || cause==='hole';
  if(b.shield && gateCause){
    b.shield=false;b.shieldUntil=0;showBanner('SHIELD HELD · '+b.c.name,PAL.shield);SFX.shield();return;
  }
  const was=G.balls.filter(x=>x.alive).length;
  b.alive=false;G.dead.push({c:b.c,user:b.user});
  if(gateCause) G.openKills++;
  const a=Math.atan2(b.y,b.x); outMarks.push({a,t:1.5});
  G.flash=1;G.shake=Math.max(G.shake,12);G.lastKill={c:b.c,t:0,user:b.user}; G.elimCard=G.lastKill; setLiveKillCard(b.c);
  for(let q=0;q<14;q++){const ang=rnd(0,Math.PI*2),sp=rnd(40,190);sparks.push({x:b.x,y:b.y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,t:rnd(.5,1.1),life:1,c:cause==='bomb'?['#ff8a3d','#ffd23d','#ff4d4d'][q%3]:['#ffd83d','#57e6ff','#7ce85f','#ff8ad0','#ffffff'][q%5]});}

function enhancedOpen(){G.phase='OPEN';G.tPhase=0;G.openKills=0;G.killQuota=1;G.closing=false;SFX.open();const n=G.balls.filter(b=>b.alive).length;if(n>3&&Math.random()<CFG.P_DOUBLE){G.killQuota=2;showBanner('DOUBLE DRAW','#ff9f1c');COMMENTARY.event('DOUBLE');}if(Math.random()<CFG.P_TUMBLE){G.tumbleT=CFG.TUMBLE_MS;G.shake=18;showBanner('TUMBLE BOOST','#ffd34d');COMMENTARY.event('TUMBLE');}if(G.rapidLeft<=0&&n>8&&Math.random()<CFG.P_RAPID){G.rapidLeft=CFG.RAPID_N;showBanner('RAPID FIRE','#ff4d6d');COMMENTARY.event('RAPID');}}

function cbr_drawAcquiredBatch2(f){
  const d = f.specialData || {};
  const kind = f.specialKind;
  const until = f.specialUntil;
  if(!kind || !Number.isFinite(until) || elapsed >= until) return;
  const phase = elapsed - (Number.isFinite(d.started) ? d.started : (until - 5));
  const px = f.body.position.x, py = f.body.position.y;
  const scale = FLAG_W * f.scale;
  ctx.save();
  ctx.translate(px, py);
  ctx.lineCap='round'; ctx.lineJoin='round';

  if(kind==='hammer'){
    const a=phase*7;
    ctx.save(); ctx.rotate(a);
    ctx.shadowColor='rgba(255,190,90,.9)'; ctx.shadowBlur=14;
    ctx.fillStyle='#704522'; ctx.fillRect(-3,-scale*.15,6,scale*.85);
    ctx.fillStyle='#303744'; ctx.beginPath(); ctx.roundRect(-scale*.48,-scale*.52,scale*.96,scale*.30,5); ctx.fill();
    ctx.fillStyle='#aeb9c8'; ctx.beginPath(); ctx.roundRect(-scale*.39,-scale*.48,scale*.78,scale*.12,3); ctx.fill();
    ctx.restore();

  }else if(kind==='tornado'){
    const pulse=1+.08*Math.sin(phase*8);
    ctx.shadowColor='#9fe5ff'; ctx.shadowBlur=18;
    for(let i=0;i<5;i++){
      const yy=-scale*.75+i*scale*.38, ww=(scale*.18+i*scale*.10)*pulse;
      ctx.strokeStyle=i%2?'rgba(190,235,255,.85)':'rgba(90,185,255,.75)';
      ctx.lineWidth=3+i*.5;
      ctx.beginPath(); ctx.moveTo(-ww,yy);
      ctx.bezierCurveTo(-ww-scale*.35,yy+scale*.12,ww+scale*.35,yy+scale*.12,ww,yy+scale*.30);
      ctx.stroke();
    }
    for(let i=0;i<12;i++){
      const t=phase*7+i*.52, r=scale*(.45+(i%4)*.16);
      ctx.fillStyle=i%2?'#c8edff':'#ffffff';
      ctx.beginPath(); ctx.arc(Math.cos(t)*r,Math.sin(t)*r*.7,2,0,Math.PI*2); ctx.fill();
    }

  }else if(kind==='magnetic'){
    const a=phase*5;
    ctx.shadowBlur=16;
    ctx.shadowColor='#668fff';
    ctx.strokeStyle='#6f9cff'; ctx.lineWidth=3.5;
    ctx.beginPath(); ctx.arc(0,0,scale*1.0,a,a+Math.PI*1.15); ctx.stroke();
    ctx.shadowColor='#ff5d75'; ctx.strokeStyle='#ff7185';
    ctx.beginPath(); ctx.arc(0,0,scale*1.0,a+Math.PI,a+Math.PI*2.15); ctx.stroke();
    ctx.shadowBlur=0;
    ctx.fillStyle='#e0445d'; ctx.fillRect(-scale*.13,-scale*.28,scale*.26,scale*.18);
    ctx.fillStyle='#4b82ff'; ctx.fillRect(-scale*.13,scale*.10,scale*.26,scale*.18);
    for(let i=0;i<14;i++){
      const t=-a+i*.45, r=scale*(.8+(i%5)*.16);
      ctx.fillStyle=i%2?'#6f9cff':'#ff7185';
      ctx.beginPath(); ctx.arc(Math.cos(t)*r,Math.sin(t)*r*.78,2,0,Math.PI*2); ctx.fill();
    }

  }else if(kind==='meteor'){
    for(let i=0;i<4;i++){
      const t=phase*.8+i*1.55, rr=scale*(.9+(i%2)*.35);
      const x=Math.cos(t)*rr, y=Math.sin(t)*rr;
      ctx.save(); ctx.translate(x,y); ctx.rotate(t+.7);
      ctx.shadowColor='#ff9b42'; ctx.shadowBlur=14;
      ctx.strokeStyle='#ff7a2d'; ctx.lineWidth=4;
      ctx.beginPath(); ctx.moveTo(-scale*.65,0); ctx.lineTo(-scale*.18,0); ctx.stroke();
      ctx.fillStyle='#555a65'; ctx.beginPath();
      ctx.moveTo(-scale*.16,-scale*.16); ctx.lineTo(scale*.18,-scale*.08);
      ctx.lineTo(scale*.14,scale*.18); ctx.lineTo(-scale*.13,scale*.14); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#ffd36b'; ctx.beginPath(); ctx.arc(scale*.06,0,3,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }

  }else if(kind==='spinningShield'){
    const a=phase*6.2;
    const R=Math.max(22,FLAG_W*f.scale);
    for(const side of [-1,1]){
      ctx.save();
      ctx.rotate(a+side*Math.PI);
      ctx.translate(R*0.95,0);
      ctx.shadowColor='#67d9ff'; ctx.shadowBlur=20;
      ctx.fillStyle='#263c55';
      ctx.beginPath();
      ctx.moveTo(0,-R*.62);
      ctx.quadraticCurveTo(R*.52,-R*.40,R*.45,R*.08);
      ctx.quadraticCurveTo(R*.32,R*.50,0,R*.72);
      ctx.quadraticCurveTo(-R*.32,R*.50,-R*.45,R*.08);
      ctx.quadraticCurveTo(-R*.52,-R*.40,0,-R*.62);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle='#d2f7ff'; ctx.lineWidth=4; ctx.stroke();
      ctx.strokeStyle='#62cfff'; ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(-R*.22,0); ctx.lineTo(R*.22,0);
      ctx.moveTo(0,-R*.27); ctx.lineTo(0,R*.27);
      ctx.stroke();
      ctx.fillStyle='#a4eaff';
      ctx.beginPath(); ctx.arc(0,0,R*.11,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
    ctx.shadowColor='#6fdcff'; ctx.shadowBlur=16;
    ctx.strokeStyle='rgba(180,242,255,.95)'; ctx.lineWidth=3.5;
    ctx.beginPath(); ctx.arc(0,0,R*1.48,a,a+Math.PI*.72); ctx.stroke();
    for(let i=0;i<6;i++){
      const t=a+i*1.05, rr=R*1.20;
      ctx.fillStyle='#e2fbff';
      ctx.beginPath(); ctx.arc(Math.cos(t)*rr,Math.sin(t)*rr,2.2,0,Math.PI*2); ctx.fill();
    }
  }

  ctx.restore();
}

function cbr_drawAcquiredBatch3(f){
  const d=f.specialData||{}, kind=f.specialKind, until=f.specialUntil;
  if(!kind || !Number.isFinite(until) || elapsed>=until) return;
  const age=elapsed-(Number.isFinite(d.started)?d.started:until-5);

      ctx.shadowColor='#ff5a22'; ctx.shadowBlur=20;

      ctx.fillStyle='#5b351f'; ctx.fillRect(-R*.12,R*.02,R*.32,R*.10);

      ctx.lineTo(R*.88,-R*.16); ctx.lineTo(R*.70,R*.03);

      ctx.quadraticCurveTo(R*.58,R*.18,R*.72,-R*.02); ctx.stroke();

      ctx.quadraticCurveTo(R*.58,R*.12,R*.69,-R*.01); ctx.stroke();

      ctx.restore();
    }

  } else if(kind==='boomerang'){
    const a=age*7;
    for(const side of [-1,1]){
      ctx.save(); ctx.rotate(a*side);
      ctx.strokeStyle='#f4c85b'; ctx.lineWidth=7; ctx.shadowColor='#ffd166'; ctx.shadowBlur=13;
      ctx.beginPath(); ctx.arc(0,0,R,-1.05,1.05); ctx.stroke();

  } else if(kind==='lightning'){

    for(let i=0;i<6;i++){
      const ang=age*4+i*Math.PI/3;

      ctx.beginPath(); ctx.moveTo(0,0);
      for(let j=1;j<=5;j++){
        const rr=R*(j/5), aa=ang+(j%2?.12:-.12);
        ctx.lineTo(Math.cos(aa)*rr,Math.sin(aa)*rr);
      }
      ctx.stroke();
    }

  } else if(kind==='iceBlast'){
    const pulse=1+.10*Math.sin(age*8), a=age*2.5;

    ctx.beginPath(); ctx.arc(0,0,R*1.1,a+Math.PI,a+Math.PI*2.3); ctx.stroke();
    for(let i=0;i<14;i++){
      const t=-age*2+i*.45, rr=R*(1+(i%5)*.12);

      ctx.lineTo(x,y+R*.16); ctx.lineTo(x-R*.08,y); ctx.closePath(); ctx.fill();

  } else if(kind==='shadowClone'){
    const a=age*2.7;
    for(let i=0;i<2;i++){

      ctx.save(); ctx.translate(Math.cos(t)*rr,Math.sin(t)*rr);
      ctx.globalAlpha=.86; ctx.shadowColor='#9b6cff'; ctx.shadowBlur=20;

      ctx.strokeStyle='#c5a6ff'; ctx.lineWidth=3; ctx.stroke();
      ctx.restore();
    }
  }
  ctx.restore();
}

      for(let q=0;q<6;q++){
        const z=q*Math.PI/3;
        ctx.strokeStyle='#ffb0b5'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(Math.cos(z)*R*.25,Math.sin(z)*R*.25);
        ctx.lineTo(Math.cos(z)*R*.42,Math.sin(z)*R*.42); ctx.stroke();
      }
      ctx.restore();
    }

  }else if(kind==='circularSaw'){
    const a=age*8;
    ctx.save(); ctx.rotate(a);
    ctx.shadowColor='#ffd25c'; ctx.shadowBlur=20;
    ctx.fillStyle='#d9dee7'; ctx.strokeStyle='#fff2b0'; ctx.lineWidth=3;
    ctx.beginPath();
    for(let i=0;i<40;i++){
      const t=i*Math.PI*2/40, rr=i%2?R*.82:R*1.15;
      const x=Math.cos(t)*rr,y=Math.sin(t)*rr;
      if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#596372'; ctx.beginPath(); ctx.arc(0,0,R*.28,0,Math.PI*2); ctx.fill();
    ctx.restore();

  }else if(kind==='dragonAura'){
    const da=age*2.8;
    ctx.shadowColor='#ff743d'; ctx.shadowBlur=24;
    ctx.strokeStyle='#ffad5a'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.arc(0,0,R*1.28,da,da+Math.PI*1.7); ctx.stroke();

    for(let i=0;i<12;i++){
      const t=-da+i*Math.PI*2/12, rr=R*(1+(i%4)*.17);
      ctx.fillStyle=i%2?'#ff7b42':'#ffd166';
      ctx.beginPath(); ctx.arc(Math.cos(t)*rr,Math.sin(t)*rr,3.5,0,Math.PI*2); ctx.fill();
    }

    const x=Math.cos(da)*R*1.18, y=Math.sin(da)*R*1.18;
    ctx.save(); ctx.translate(x,y); ctx.rotate(da+.55);
    ctx.fillStyle='#ff6b3d';
    ctx.beginPath();
    ctx.moveTo(-R*.30,R*.14); ctx.quadraticCurveTo(-R*.36,-R*.18,-R*.10,-R*.28);
    ctx.lineTo(R*.16,-R*.20); ctx.lineTo(R*.34,-R*.06); ctx.lineTo(R*.19,R*.04);
    ctx.lineTo(R*.37,R*.18); ctx.lineTo(R*.08,R*.15); ctx.lineTo(-R*.08,R*.34);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='#ffd166'; ctx.beginPath(); ctx.arc(R*.12,-R*.08,R*.045,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#ffdc7a'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(-R*.08,-R*.23); ctx.lineTo(-R*.22,-R*.42);
    ctx.moveTo(R*.01,-R*.24); ctx.lineTo(R*.16,-R*.43); ctx.stroke();
    ctx.restore();
  }else if(kind==='shockwave'){
    const a=age*7, pulse=1+.12*Math.sin(age*8);
    ctx.shadowColor='#fff08a'; ctx.shadowBlur=22;
    ctx.strokeStyle='#fff6ad'; ctx.lineWidth=4;
    for(let i=0;i<3;i++){
      const rr=R*(.65+i*.48)*pulse;
      ctx.beginPath(); ctx.arc(0,0,rr,a+i*.8,a+i*.8+Math.PI*1.65); ctx.stroke();
    }
    for(let i=0;i<10;i++){
      const t=a+i*.63, rr=R*(1.25+(i%3)*.12);
      ctx.fillStyle='#fff2a0';
      ctx.beginPath(); ctx.arc(Math.cos(t)*rr,Math.sin(t)*rr,2.5,0,Math.PI*2); ctx.fill();
    }
  }

  ctx.restore();
}

/* Exact Circular Ring first-batch acquired-equipment artwork.
   Only the coordinate/state adapter differs: Natural balls use x/y local to the arena. */
function cbr_drawFirstBatch(b){
  const px=CFG.CX+b.x, py=CFG.CY+b.y;
  const w=FLAG_W*(b.scale||1), h=FLAG_W*(b.scale||1);
  const f={specialKind:b.specialKind,specialUntil:elapsed+(b.specialUntil||0),specialData:{phase:b.specialPhase||0}};
  const R=CFG.BALL_R*(b.scale||1);
  /* Detailed temporary equipment visuals.  The first five abilities are drawn
     as readable game props around the flag, with the exact same geometry used by
     their physics tests above. */
  if(f.specialKind && elapsed < f.specialUntil){
    const age=elapsed-(f.specialUntil-5), pulse=.55+.45*Math.sin(elapsed*8), rot=elapsed;
    const kind=f.specialKind;
    const specialData=f.specialData || {phase:0};
    const phase=Number.isFinite(specialData.phase) ? specialData.phase : 0;
    const C={katana:'#ff4fd8',electric:'#54e9ff',fireRing:'#ff6b2e',forceField:'#55baff',twinAxes:'#ffd166'}[kind]||'#ffffff';
    const intro=Math.min(1,age/.32);
    const eased=1-Math.pow(1-intro,3);
    const fade=Math.min(1,(f.specialUntil-elapsed)/.35);
    const scaleIn=.72+.28*eased;
    const rr=Math.max(w,h)*.78;
    ctx.save();
    ctx.translate(px,py);
    ctx.scale(scaleIn,scaleIn);
    ctx.globalAlpha=.96*fade;
    ctx.lineCap='round';
    ctx.lineJoin='round';
    ctx.shadowColor=C;
    ctx.shadowBlur=18+10*pulse;

    function glowCircle(r, stroke, width, alpha){
      ctx.save();ctx.globalAlpha*=alpha;ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();ctx.restore();
    }
    function drawKatana(a){
      const inner=18, outer=61;
      ctx.save();ctx.rotate(a);
      /* handle */
      ctx.strokeStyle='#161922';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(23,0);ctx.stroke();
      ctx.strokeStyle='#e7edf6';ctx.lineWidth=2;ctx.beginPath();
      for(let q=0;q<4;q++){ctx.moveTo(10+q*3,-3);ctx.lineTo(13+q*3,3);}ctx.stroke();
      /* guard */
      ctx.strokeStyle='#d9a73d';ctx.lineWidth=5;ctx.beginPath();ctx.arc(24,0,7,-Math.PI*.55,Math.PI*.55);ctx.stroke();
      /* curved blade */
      ctx.shadowColor='#fff';ctx.shadowBlur=7;ctx.strokeStyle='#f5f8ff';ctx.lineWidth=6;ctx.beginPath();
      ctx.moveTo(inner,0);ctx.quadraticCurveTo(outer*.72,-7,outer,0);ctx.stroke();
      ctx.shadowColor=C;ctx.shadowBlur=10;ctx.strokeStyle=C;ctx.lineWidth=2;ctx.beginPath();
      ctx.moveTo(inner+1,-1);ctx.quadraticCurveTo(outer*.72,-8,outer,0);ctx.stroke();
      /* tip glint */
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(outer,0,2.5,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }
    function drawAxe(a){
      ctx.save();ctx.rotate(a);
      const handle=54;
      ctx.strokeStyle='#7a4b25';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(handle,0);ctx.stroke();
      ctx.shadowColor=C;ctx.shadowBlur=8;ctx.fillStyle='#e4eaf2';ctx.strokeStyle='#8d98aa';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(12,-10);ctx.quadraticCurveTo(31,-22,48,-12);ctx.quadraticCurveTo(58,0,48,12);ctx.quadraticCurveTo(31,22,12,10);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.strokeStyle=C;ctx.lineWidth=2;ctx.beginPath();ctx.arc(42,0,12,-.9,.9);ctx.stroke();
      ctx.restore();
    }
    if(kind==='katana'){
      glowCircle(29,C,2,0.38);
      drawKatana(rot*4.15+phase);
      drawKatana(rot*4.15+phase+Math.PI);
      ctx.save();ctx.globalAlpha=.28+.15*pulse;ctx.strokeStyle=C;ctx.lineWidth=2;ctx.setLineDash([5,7]);ctx.beginPath();ctx.arc(0,0,66,0,Math.PI*2);ctx.stroke();ctx.restore();
    } else if(kind==='electric'){
      const R=53+2*Math.sin(rot*9);
      glowCircle(R,'#54e9ff',8,.25);
      ctx.strokeStyle='#c8faff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,R,0,Math.PI*2);ctx.stroke();
      ctx.strokeStyle=C;ctx.lineWidth=2.5;
      for(let i=0;i<10;i++){
        const a=rot*3+i*Math.PI*2/10;
        const r1=R-9, r2=R+4;
        const x1=Math.cos(a)*r1,y1=Math.sin(a)*r1;
        const x2=Math.cos(a+.12)*r2,y2=Math.sin(a+.12)*r2;
        const xm=Math.cos(a+.06)*(r1+7),ym=Math.sin(a+.06)*(r1+7);
        ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(xm,ym);ctx.lineTo(x2,y2);ctx.stroke();
      }
      ctx.fillStyle='#dfffff';ctx.beginPath();ctx.arc(0,0,5+2*pulse,0,Math.PI*2);ctx.fill();
    } else if(kind==='fireRing'){
      /* A real flame halo: layered ember core + broken hot ring + individually
         shaped flames.  The ring is kept outside the flag so it reads as an
         acquired weapon rather than a giant flat circle. */
      const R=56 + 2*Math.sin(rot*5.2);
      const R2=R-6;
      ctx.save();
      ctx.globalAlpha=.24;
      ctx.strokeStyle='#ff3b18'; ctx.lineWidth=18;
      ctx.beginPath(); ctx.arc(0,0,R,0,Math.PI*2); ctx.stroke();
      ctx.globalAlpha=.95;
      ctx.shadowColor='#ff4b1f'; ctx.shadowBlur=18;
      /* broken hot segments */
      for(let seg=0;seg<12;seg++){
        const a0=rot*.72 + seg*Math.PI*2/12 + .055;
        const a1=a0 + Math.PI*2/12*.72;
        ctx.strokeStyle=seg%3===0?'#fff0a8':(seg%2?'#ff6a24':'#ffb02e');
        ctx.lineWidth=6;
        ctx.beginPath(); ctx.arc(0,0,R2,a0,a1); ctx.stroke();
      }
      /* flame tongues */
      for(let i=0;i<24;i++){
        const a=rot*1.15 + i*Math.PI*2/24;
        const wob=.65+.35*Math.sin(rot*7+i*1.7);
        const rr=R + Math.sin(rot*4+i)*2;
        const fx=Math.cos(a)*rr, fy=Math.sin(a)*rr;
        ctx.save();
        ctx.translate(fx,fy);
        ctx.rotate(a+Math.PI/2);
        const h=7+7*wob, bw=4+2*wob;
        ctx.fillStyle=i%4===0?'#fff4b0':(i%2?'#ff6a20':'#ffb52d');
        ctx.beginPath();
        ctx.moveTo(0,-h);
        ctx.quadraticCurveTo(bw,-h*.38,0,h*.28);
        ctx.quadraticCurveTo(-bw,-h*.38,0,-h);
        ctx.fill();
        ctx.restore();
      }
      /* floating embers */
      ctx.shadowBlur=6;
      for(let i=0;i<12;i++){
        const a=rot*.8+i*2.4;
        const rr=R+8+5*Math.sin(rot*3+i);
        ctx.fillStyle=i%2?'#ff7a2a':'#ffe08a';
        ctx.beginPath();
        ctx.arc(Math.cos(a)*rr,Math.sin(a)*rr,1.3+0.8*pulse,0,Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    } else if(kind==='forceField'){
      const R=62+3*pulse;
      glowCircle(R,C,10,.22);
      ctx.strokeStyle='#d9f5ff';ctx.lineWidth=3;ctx.setLineDash([10,6]);ctx.beginPath();ctx.arc(0,0,R,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
      ctx.strokeStyle=C;ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,R-7,rot*1.3,rot*1.3+Math.PI*1.35);ctx.stroke();
      for(let i=0;i<8;i++){
        const a=rot*.8+i*Math.PI/4;
        ctx.save();ctx.translate(Math.cos(a)*R,Math.sin(a)*R);ctx.rotate(a);
        ctx.fillStyle=C;ctx.beginPath();ctx.moveTo(9,0);ctx.lineTo(-2,-5);ctx.lineTo(-2,5);ctx.closePath();ctx.fill();ctx.restore();
      }
      ctx.fillStyle='rgba(85,186,255,.10)';ctx.beginPath();ctx.arc(0,0,R-4,0,Math.PI*2);ctx.fill();
    } else if(kind==='twinAxes'){
      /* Two proper battle axes are mounted on opposite sides of the flag.
         The hafts point outward, while the curved cutting faces lead the
         rotation.  This makes the visible blade match the intended contact
         area instead of looking like two triangles on a stick. */
      const a0=rot*3.35+phase;
      function drawBattleAxe(a, side){
        ctx.save();
        ctx.rotate(a);
        const inner=18, grip=53;
        /* leather-wrapped haft */
        ctx.strokeStyle='#5a351f'; ctx.lineWidth=7;
        ctx.beginPath(); ctx.moveTo(inner,0); ctx.lineTo(grip,0); ctx.stroke();
        ctx.strokeStyle='#b9783f'; ctx.lineWidth=2;
        for(let k=0;k<5;k++){
          const x=inner+9+k*6;
          ctx.beginPath();ctx.moveTo(x,-3.5);ctx.lineTo(x+3,3.5);ctx.stroke();
        }
        /* metal neck */
        ctx.strokeStyle='#9aa6b8';ctx.lineWidth=4;
        ctx.beginPath();ctx.moveTo(inner-1,0);ctx.lineTo(inner+11,0);ctx.stroke();
        /* broad crescent blade */
        const bx=inner+13;
        ctx.shadowColor=C; ctx.shadowBlur=13;
        const grad=ctx.createLinearGradient(bx,-22,bx+20,12);
        grad.addColorStop(0,'#f7fbff');
        grad.addColorStop(.45,'#c9d2df');
        grad.addColorStop(1,'#697586');
        ctx.fillStyle=grad;
        ctx.beginPath();
        ctx.moveTo(bx,-18);
        ctx.quadraticCurveTo(bx+20,-24,bx+25,-8);
        ctx.quadraticCurveTo(bx+28,2,bx+20,13);
        ctx.quadraticCurveTo(bx+10,21,bx+1,17);
        ctx.quadraticCurveTo(bx+12,7,bx+12,-1);
        ctx.quadraticCurveTo(bx+10,-10,bx,-18);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle='#eef5ff';ctx.lineWidth=1.8;ctx.stroke();
        /* colored cutting edge */
        ctx.strokeStyle=C;ctx.lineWidth=2.2;
        ctx.beginPath();
        ctx.moveTo(bx+22,-9);
        ctx.quadraticCurveTo(bx+27,2,bx+19,12);
        ctx.stroke();
        /* small pommel */
        ctx.fillStyle='#d8b06a';ctx.beginPath();ctx.arc(grip+1,0,4,0,Math.PI*2);ctx.fill();
        ctx.restore();
      }
      glowCircle(25,C,2,0.24);
      drawBattleAxe(a0,1);
      drawBattleAxe(a0+Math.PI,-1);
      /* very subtle motion trail, kept behind the actual blades */
      ctx.save();
      ctx.globalAlpha=.18;ctx.strokeStyle=C;ctx.lineWidth=2;ctx.setLineDash([3,8]);
      ctx.beginPath();ctx.arc(0,0,67,a0-.7,a0+.7);ctx.stroke();
      ctx.beginPath();ctx.arc(0,0,67,a0+Math.PI-.7,a0+Math.PI+.7);ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }
}
